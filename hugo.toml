baseURL = "https://yuanmk26.github.io/"
locale = "zh-cn"
defaultContentLanguage = "zh-cn"
title = "Notes from Yuan's Bench"
theme = "blowfish"

[languages.en]
disabled = true

[languages.zh-cn]
locale = "zh-cn"
title = "Notes from Yuan's Bench"

[languages.zh-cn.params]
displayName = "简体中文"
isoCode = "zh-CN"

[outputs]
home = ["HTML", "RSS", "JSON"]

[pagination]
pagerSize = 10

[params]
colorScheme = "blowfish"
defaultAppearance = "light"
autoSwitchAppearance = true
enableCodeCopy = true

[params.author]
name = "Yuan"
headline = "Signals, circuits, detectors, and the quiet work behind measurement."

[params.homepage]
layout = "profile"
showRecent = true
showRecentItems = 5

[params.article]
showBreadcrumbs = true
showPagination = true
showReadingTime = true
showTableOfContents = true

[markup.goldmark.parser]
wrapStandAloneImageWithinParagraph = false

[markup.goldmark.parser.attribute]
block = true

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.extensions.passthrough]
enable = true

[markup.goldmark.extensions.passthrough.delimiters]
block = [['\\[', '\\]'], ['$$', '$$']]
inline = [['\\(', '\\)']]

[markup.highlight]
noClasses = false

[markup.tableOfContents]
startLevel = 2
endLevel = 4

[[menu.main]]
name = "Posts"
url = "/posts/"
weight = 10

[[menu.main]]
name = "Tags"
url = "/tags/"
weight = 20

[[menu.main]]
name = "About"
url = "/about/"
weight = 30
